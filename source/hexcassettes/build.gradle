import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'dev.architectury.loom' version "${loom_version}"
    id 'maven-publish'
    id "org.jetbrains.kotlin.jvm" version "${kotlin_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.blamejared.com/" } // Для Patchouli
    maven { url = "https://maven.shedaniel.me/" }   // Для Cloth Config
    maven { url = "https://maven.architectury.dev/" } // Для Architectury
    maven { url = "https://thedarkcolour.github.io/KotlinForForge/" }
    maven { url = "https://maven.neoforged.net/releases" }
    maven { url = "https://maven.theillusivec4.top/" } // Для Caelus
    mavenCentral()
}
loom {
}
dependencies {
    minecraft "com.mojang:minecraft:$minecraft_version"
    mappings loom.officialMojangMappings()

    neoForge "net.neoforged:neoforge:$neoforge_version"
    implementation "thedarkcolour:kotlinforforge-neoforge:$kotlinforforge_version"


    modImplementation files("${rootProject.rootDir}/libs/hexcasting-neoforge-1_21_1-0_12_0-devel-patched.jar")
    modImplementation files("${rootProject.rootDir}/libs/paucal-0.7.1-noelle+1.21.1-neoforge.jar")
    modImplementation files("${rootProject.rootDir}/libs/architectury-13.0.8-neoforge.jar")
    modImplementation files("${rootProject.rootDir}/libs/Patchouli-1.21.1-93-NEOFORGE.jar")
    modImplementation files("${rootProject.rootDir}/libs/cloth-config-15.0.140-neoforge.jar")
    modImplementation files("${rootProject.rootDir}/libs/inline-neoforge-1.21.1-1.2.2.jar")
    modImplementation files("${rootProject.rootDir}/libs/caelus-neoforge-7.0.1+1.21.1.jar")
    modImplementation files("${rootProject.rootDir}/libs/hexpose-1.0.1-neoforge.jar")
}

processResources {
    inputs.property "version", version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "21"
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}