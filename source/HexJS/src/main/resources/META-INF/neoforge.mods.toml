# Мод-лоадер NeoForge
modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/Nanorasmus/HexCircus/issues"

# Конфигурация Mixin
[[mixins]]
config = "hex_js.mixins.json"

# Информация о моде
[[mods]]
modId = "hexjs"
version = "${version}"
displayName = "HexJS"
authors = "BlackyMoon"
logoFile = "icon.png"
description = '''
Addon for Hex Casting integrated with KubeJS.
'''

# Зависимости
[[dependencies.hexjs]]
modId = "neoforge"
type = "required"
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.hexjs]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.hexjs]]
modId = "hexcasting"
type = "required"
versionRange = "[0.11.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.hexjs]]
modId = "kubejs"
type = "required"
versionRange = "[2101.7,)"
ordering = "NONE"
side = "BOTH"