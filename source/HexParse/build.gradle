plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}
    
repositories {
    mavenLocal()
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
kotlin.jvmToolchain(21)

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'hexparse'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'hexparse'
        }
    }

    mods {
        "hexparse" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    def ver = version
    inputs.property "version", ver
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": ver
    }
}
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:2.2.0"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.0"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.0"
        force "org.jetbrains.kotlin:kotlin-reflect:2.2.0"
    }
}
dependencies {
    implementation "thedarkcolour:kotlinforforge-neoforge:$kotlinforforge_version"
    implementation "io.github.llamalad7:mixinextras-neoforge:0.4.1"
    implementation 'org.ejml:ejml-simple:0.46.0'
    implementation fileTree(dir: "${rootProject.rootDir}/libs", include: "*.jar")
}

tasks.named('jar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}